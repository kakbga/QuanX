# 红果短剧 去广告 QX 重写规则 v2.2（配套 hongguo-adblock.list）
# 用途：QX -> 资源 -> 重写(Rewrite) 远程资源，粘贴本文件 raw 链接
#
# v2.2 修复：移除 *.snssdk.com / *.byted.org 的 MITM ——
#   红果视频播放接口 vas-lf-x.snssdk.com 带证书绑定，一 MITM 就握手失败、视频放不出来。
#   MITM 只保留“广告资源/配置/统计”这类非绑定、非正片的域，绝不碰 snssdk。
#
# 作用：按路径拦截广告运行时资源包(gecko: nextad_runtime_series)，不影响其它 gecko 资源与正片。

[rewrite_local]
# 广告运行时资源包（字节 gecko: nextad_runtime）
^https?:\/\/[\w.-]+\.bytegecko\.com\/.+\/gecko\/resource\/nextad_runtime.+ url reject

[mitm]
# 只 MITM 广告/配置/统计 CDN（均非正片、无 pinning）；不含任何 snssdk / byted 正片域
hostname = *.bytegecko.com, gecko.zijieapi.com, media-show.wanzi.com
